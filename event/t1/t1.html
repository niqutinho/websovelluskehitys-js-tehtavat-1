<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="t1.css">
  <script src="t1.js" defer></script>
</head>

<body>
  <h1>Todo List</h1>
  <ul aria-label="Todo items"></ul>
  <dialog class="add-dialog">
    <h2>Add Todo Item</h2>
    <form class="add-form">
      <label for="todo-name">Item name</label>
      <input id="todo-name" name="task" type="text" placeholder="Add todo item here" required>
      <button type="submit">Save</button>
      <button class="cancel-btn" type="button">Cancel</button>
    </form>
  </dialog>
  <button class="add-btn" type="button">Add Item</button>
</body>

</html>
