<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurants</title>
  <link rel="stylesheet" href="t2.css">
  <script src="t2.js" defer></script>
</head>

<body>
  <h1>Restaurants</h1>
  <table>
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Address</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <dialog aria-labelledby="restaurant-title">
    <h2 id="restaurant-title"></h2>
    <dl class="restaurant-details"></dl>
    <form method="dialog">
      <button type="submit">Close</button>
    </form>
  </dialog>
</body>

</html>
